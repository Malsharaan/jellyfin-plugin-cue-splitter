name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        run: dotnet publish src/Jellyfin.Plugin.CueSplitter/Jellyfin.Plugin.CueSplitter.csproj --configuration Release --output artifacts/publish

      - name: Package
        run: |
          mkdir -p artifacts/zip
          cp artifacts/publish/Jellyfin.Plugin.CueSplitter.dll artifacts/zip/
          cd artifacts/zip && zip ../cue-splitter.zip *

      - uses: actions/upload-artifact@v4
        with:
          name: cue-splitter
          path: artifacts/cue-splitter.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/cue-splitter.zip
