version: "1.0.5.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Virtual tracks from CUE sheets"
description: >
  Shows the tracks of single-file album images (FLAC, APE, WavPack, WAV...)
  described by a .cue sheet as individual songs, without splitting or modifying
  the original file. Tracks are decoded on the fly, sample-accurately.
category: "Music"
owner: "Malsharaan"
artifacts:
  - "Jellyfin.Plugin.CueSplitter.dll"
changelog: >
  CUE tracks are now served as FLAC by default (cached on first play, about half the
  bandwidth of WAV, same lossless audio), so apps that do not play WAV directly, such as
  Wholphin, no longer need transcoding. WAV remains available in the settings.
