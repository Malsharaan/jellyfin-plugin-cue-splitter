overview: "Virtual tracks from CUE sheets"
description: >
  Shows the tracks of single-file album images (FLAC, APE, WavPack, WAV...)
  described by a .cue sheet as individual songs, without splitting or modifying
  the original file. Tracks are decoded on the fly, sample-accurately.
category: "Music"
owner: "Malsharaan"
artifacts:
  - "Jellyfin.Plugin.CueSplitter.dll"
changelog: >
  Fix: albums already split into one file per track whose .cue sheet uses the EAC
  non-compliant (gaps appended) layout had most of their tracks hidden. Tracks are now
  attached to the file holding their INDEX 01, and sheets with one file per track are
  never treated as album images.
